name: Pipeline de Calidad (SQA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Requerido por SonarCloud

    - name: Instalar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Ajusta si usas otra versión

    - name: Restaurar dependencias
      run: dotnet restore RinconGuatemalteco.slnx

    - name: Compilar (Build)
      run: dotnet build RinconGuatemalteco.slnx --no-restore --configuration Release

    - name: Instalar dotnet-coverage
      run: dotnet tool install --global dotnet-coverage

    - name: Ejecutar Pruebas y generar cobertura
      run: dotnet-coverage collect "dotnet test RinconGuatemalteco.slnx --configuration Release" -f xml -o "coverage.xml"

    - name: Verificar archivo de cobertura (Diagnóstico)
      run: |
        echo "Buscando archivo de cobertura..."
        find . -name "coverage.xml"
        echo "Contenido de las primeras líneas del archivo:"
        cat coverage.xml | head -n 10

    - name: Instalar Herramienta de SonarCloud
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Iniciar Análisis de SonarCloud
      run: >
        dotnet sonarscanner begin 
        /k:"dxon77_RinconGuatemalteco-SQA" 
        /o:"dxon77" 
        /d:sonar.token="${{ secrets.SONAR_TOKEN }}" 
        /d:sonar.host.url="https://sonarcloud.io" 
        /d:sonar.cs.vscoveragexml.reportsPaths="${{ github.workspace }}/coverage.xml"

    - name: Compilar con Sonar
      run: dotnet build RinconGuatemalteco.slnx --no-incremental --configuration Release

    - name: Finalizar Análisis de SonarCloud
      run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
